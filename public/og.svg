<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#paint0_linear)" fill-opacity="0.8"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#334155" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#334155" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Decorative Glow -->
  <circle cx="200" cy="150" r="250" fill="#2563EB" fill-opacity="0.25" filter="blur(80px)"/>
  <circle cx="1000" cy="480" r="300" fill="#10B981" fill-opacity="0.2" filter="blur(90px)"/>

  <!-- Main Card Graphic -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Badge -->
  <rect x="130" y="130" width="220" height="40" rx="20" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" stroke-opacity="0.4"/>
  <text x="240" y="155" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle">FREE TRADING TOOLS</text>

  <!-- Main Title -->
  <text x="130" y="230" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.02em">Risk Reward Calculator</text>
  <text x="130" y="290" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600">Win Rate &amp; Stock Average Calculator</text>

  <!-- Bullet Features / Key metrics -->
  <g transform="translate(130, 340)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="260" height="90" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="#334155"/>
    <text x="20" y="35" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">RISK : REWARD</text>
    <text x="20" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">1 : 3 Ratio</text>

    <!-- Feature 2 -->
    <rect x="280" y="0" width="260" height="90" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="#334155"/>
    <text x="300" y="35" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">WIN RATE</text>
    <text x="300" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Break-Even %</text>

    <!-- Feature 3 -->
    <rect x="560" y="0" width="260" height="90" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="#334155"/>
    <text x="580" y="35" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">STOCK AVERAGE</text>
    <text x="580" y="65" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Average Down</text>
  </g>

  <!-- Domain Branding -->
  <text x="1010" y="500" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="end">risktorewardcalculator.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
</svg>
